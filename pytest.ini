[pytest]
testpaths = apps/api/tests apps/executor/tests tests/e2e
pythonpath = tests
addopts = -ra --strict-markers -p no:cacheprovider --import-mode=importlib
markers =
    integration: vereist PostgreSQL (HUB_TEST_ADMIN_URL, standaard postgres@127.0.0.1:5432)
    e2e: dienst-E2E met de fake TrueNAS-simulator
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
