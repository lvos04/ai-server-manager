[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "asm-policy"
version = "0.1.0"
description = "AI Server Manager — gedeeld risicobeleid: policy laden, classificeren, parameterschema's en ExecutionRequest (Hub en executor)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML==6.0.3",
  "cryptography==50.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asm_policy"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["asm_policy"]
