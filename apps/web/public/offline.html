<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — TrueNAS Home Platform</title>
<!-- Zelfstandige offlinepagina (service worker): Peil 1.1.0-kleuren inline, systeemfont, geen externe bronnen. -->
<style>
  :root { color-scheme: light; --background:#EEF1F5; --foreground:#0B0F14; --muted-foreground:#353E4A; --card:#FFFFFF; --border:#AEB8C5; --unknown:#566070; --unknown-bg:#E9EDF2; --unknown-ink:#2A313B; --primary:#123DA3; --primary-hover:#0C2F80; --primary-foreground:#FFFFFF; --ring:#123DA3; --ring-halo:#FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --background:#0A0D12; --foreground:#F2F5F8; --muted-foreground:#C2CAD5; --card:#141920; --border:#3A4451; --unknown:#A3ADBB; --unknown-bg:#222932; --unknown-ink:#DCE2EA; --primary:#8DB6FF; --primary-hover:#B0CCFF; --primary-foreground:#06101F; --ring:#8DB6FF; --ring-halo:#0A0D12; } }
  body { margin:0; background:var(--background); color:var(--foreground); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif; font-size:1rem; line-height:1.5rem; }
  main { max-width:36rem; margin:10vh auto; padding:1rem; }
  .kaart { background:var(--card); border:2px dashed var(--unknown); border-radius:0.5rem; padding:1.25rem; }
  .status { display:inline-flex; align-items:center; gap:0.375rem; min-height:2rem; padding:0 0.625rem; border:2px dashed var(--unknown); border-radius:999px; background:var(--unknown-bg); color:var(--unknown-ink); font-weight:600; font-size:0.875rem; }
  h1 { font-size:1.5rem; line-height:2rem; margin:0.75rem 0; }
  p { color:var(--muted-foreground); }
  button { min-height:2.75rem; padding:0.5rem 1rem; border-radius:0.5rem; border:2px solid transparent; background:var(--primary); color:var(--primary-foreground); font:inherit; font-weight:600; cursor:pointer; }
  button:hover { background:var(--primary-hover); }
  :focus-visible { outline:3px solid var(--ring); outline-offset:2px; box-shadow:0 0 0 2px var(--ring-halo); }
</style>
</head>
<body>
<main id="inhoud">
  <div class="kaart" role="status" data-testid="offline-pagina">
    <span class="status">Onbekend — offline</span>
    <h1>Geen verbinding met de Hub</h1>
    <p>Je bent offline of de Hub is niet bereikbaar. Gegevens zijn niet actueel en worden hier niet getoond: er komt niets uit een oude kopie alsof het actueel is, en wijzigen kan niet. Zodra de verbinding terug is, halen we alles opnieuw op.</p>
    <button type="button" onclick="location.reload()">Opnieuw proberen</button>
  </div>
</main>
</body>
</html>
