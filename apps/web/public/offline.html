<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · AI Server Manager</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f8; --fg:#141820; --muted:#475162; --card:#fff; --border:#d3d9e2; --warn-bg:#fcefd2; --warn-fg:#6b3a0f; --primary:#1d4ed8; --on-primary:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1217; --fg:#e8ecf1; --muted:#aab4c2; --card:#161b22; --border:#2f3946; --warn-bg:#3c2b0b; --warn-fg:#f6d58c; --primary:#8db4ff; --on-primary:#0a1222; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  main { max-width:560px; margin:10vh auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
  .badge { display:inline-block; background:var(--warn-bg); color:var(--warn-fg); border-radius:999px; padding:2px 12px; font-weight:700; }
  button { min-height:44px; padding:8px 16px; border-radius:10px; border:1px solid var(--primary); background:var(--primary); color:var(--on-primary); font:inherit; font-weight:600; cursor:pointer; }
  p { color:var(--muted); }
</style>
</head>
<body>
<main id="inhoud">
  <div class="card" role="status" data-testid="offline-pagina">
    <p class="badge">Offline</p>
    <h1>Geen verbinding met de Hub</h1>
    <p>Je apparaat is offline of de Hub is niet bereikbaar. Zolang er geen verbinding is, zijn alle gegevens <strong>onbekend</strong>: er wordt niets uit een oude kopie als actueel getoond en wijzigen kan niet.</p>
    <button type="button" onclick="location.reload()">Opnieuw proberen</button>
  </div>
</main>
</body>
</html>
