# Manifest (manifeststandaard v1, platformcontract 1.3 §9) van de executor: ai-server-manager-executor.
# Eigen image en eigen standaard TrueNAS Custom App; de enige component met een TrueNAS-key met schrijfrechten (alleen
# op zijn eigen statuspagina in te voeren). Koppelen met koppelcode; voert alleen acties uit het beleid uit (ADR-0030).
manifest_version: "1"
app_id: ai-server-manager-executor
name: AI Server Manager (executor)
owner_repo: lvos04/ai-server-manager
category: platform
description_nl: >-
  Executor van het platform: voert alleen door de Hub ondertekende acties uit die op de allowlist van het beleid staan,
  via de TrueNAS-API, en controleert elk verzoek zelf opnieuw. Koppelen met de Hub gaat met een koppelcode en de
  Hub-vingerafdruk op de statuspagina; zolang hij niet gekoppeld is of geen TrueNAS-sleutel met schrijfrechten heeft,
  voert hij niets uit.
version: "0.1.0"
install:
  method: custom_app
image:
  repository: ghcr.io/lvos04/ai-server-manager-executor
  tag: "0.1.0"
  digest: null
custom_app:
  storage:
    - name: appdata
      type: host_path
      host_path: {param: appdata_path}
  env: []
  resources:
    cpus: 1
    memory_mib: 256
  gpu: none
  run_as:
    mode: image_default
  timezone: {param: timezone}
  restart_policy: unless-stopped
  portal:
    port: api
    scheme: http
    path: /
    name: Executor
parameters:
  - name: host_port
    type: port
    source: default
    default: 30410
    required: true
    description_nl: Hostpoort; voorstel uit het platformcontract. Bij de eerste installatie kiest de gebruiker zelf een vrije poort.
  - name: appdata_path
    type: path
    source: dataset_picker
    dataset_role: executor_appdata
    decision: D02
    required: true
    description_nl: Eigen dataset voor /appdata (identiteit en vault van de executor), gescheiden van de Hub.
  - name: timezone
    type: timezone
    source: wizard
    required: true
    description_nl: Tijdzone van de NAS, gemeten of bevestigd in de onboarding-wizard.
storage:
  - name: appdata
    mount: /appdata
    kind: config
    required_dataset_role: executor_appdata
    description_nl: Eigen Ed25519-identiteit en vault.key in /appdata/secrets (0600); later de nonce-opslag.
network:
  ports:
    - name: api
      container_port: 30410
      host_port: {param: host_port}
      protocol: tcp
      purpose_nl: Statuspagina met koppelformulier van de executor
  host_network: false
  host_network_reason: null
privileges:
  privileged: false
  cap_add: []
  devices: []
  gpu: none
privilege_reason: null
healthcheck:
  type: builtin
  # Monitorplan (contract 1.3 §9, B09): /readyz (eigen geheimen en datamap; de koppeling telt niet mee, §5). De
  # beheerder neemt het over in Uptime Kuma en bevestigt het per monitor ("handmatig bevestigd").
  monitor: {pad: /readyz, verwachte_status: 200, timeout_s: 10, interval_s: 60}
backup:
  db_export:
    method: none
    description_nl: Geen database; alleen de eigen geheimen en hub-link.json in /appdata/secrets (dataset-snapshot, extern alleen versleuteld).
  snapshot_datasets: [appdata]
  rpo: P1D
  rto: PT4H
dependencies:
  - app_id: ai-server-manager
    kind: required
    reason_nl: De executor koppelt met de Hub en voert alleen door de Hub ondertekende verzoeken uit.
sso: none
risk:
  install: R2
  update: R2
  uninstall: R2
upgrade:
  migrations: false
  tag_only_rollback_safe: true
  notes_nl: >-
    Geen database. hub-link.json (schema 1.3) blijft staan; een lezer accepteert elke 1.x en negeert onbekende velden
    (contract 1.3 §3.5), dus een oudere tag leest hem gewoon.
decisions_required: [D01, D02, D03]
docs: [B02_AI_SERVER_MANAGER, I23_HOME_CONTROL_HUB]
validation_status: unvalidated
compatibility:
  truenas_min_version: "24.10.0"
  truenas_max_version: null
  ix_app_min_version: null
provenance:
  source_repo: https://github.com/lvos04/ai-server-manager
  source_commit: null
  upstream_repo: null
  license: GPL-3.0
accepted_findings:
  - code: digest_pending_release
    reden_nl: >-
      Eigen image vóór de eerste release: de release-CI vult de digest in (release/digests.json). Tot dan blokkeert
      de vertaling de installatie via de API met digest_not_pinned; de eerste installatie gaat met het formulier.
